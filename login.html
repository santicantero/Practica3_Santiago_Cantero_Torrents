<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link rel="icon" type="image/x-icon" href="img/logo3.ico">
  <link rel="stylesheet" href="bs.css">
</head>

<body>
  <header class="header">
    <div class="box d-flex justify-content-between align-items-center py-3">
      <a href="index.html" class="logo">FRESHSTYLE</a>
      <nav class="actions d-none d-md-flex gap-4">
        <a href="registro.html">REGISTRARSE</a>
      </nav>
    </div>
  </header>

  <main class="auth box my-4">
    <div class="row g-4 align-items-stretch">

      <section class="col-lg-6">
        <div class="auth-hero panel h-100 d-flex flex-column justify-content-end">
          <div class="auth-hero__badge">FreshStyle Crew</div>
          <h1>Vuelve a tu estilo</h1>
          <p>Inicia sesión para acceder a tus pedidos, listas guardadas y ventajas del club.</p>
          <a href="registro.html" class="btn btn-light btn-sm">Crear cuenta</a>
        </div>
      </section>

      <section class="col-lg-6">
        <div class="panel auth-card h-100">
          <h2 class="h4 mb-3">Iniciar sesión</h2>
          <form onsubmit="event.preventDefault(); new bootstrap.Modal('#ok').show();">
            <div class="mb-3">
              <label class="form-label">Correo</label>
              <input type="email" class="form-control" placeholder="tu@email.com" required>
            </div>

            <div class="mb-2 position-relative">
              <label class="form-label">Contraseña</label>
              <input id="pass" type="password" class="form-control pe-5" placeholder="••••••••" required>
              <button type="button" class="btn btn-sm btn-outline-dark auth-toggle" aria-label="Mostrar contraseña"
                onclick="const i=document.getElementById('pass'); i.type = i.type==='password'?'text':'password'">
                Ver
              </button>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input id="rec" class="form-check-input" type="checkbox">
                <label class="form-check-label" for="rec">Recuérdame</label>
              </div>
              <a href="#" class="link-secondary text-decoration-none">¿Olvidaste tu contraseña?</a>
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-dark" type="submit" data-bs-toggle="modal" data-bs-target="#exampleModal"
                id="ok3">Entrar</button>
              <a class="btn btn-outline-dark" href="registro.html" id="ok2">Crear cuenta</a>
            </div>

            <hr class="my-4">
            <div class="d-grid gap-2">
              <button class="btn btn-outline-dark">Continuar con Google</button>
              <button class="btn btn-outline-dark">Continuar con Apple</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <!-- Modal de OK -->
  <div class="modal fade" id="exampleModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Operación completada</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">Registro completado. ¡Bienvenido/a a FreshStyle!</div>
        <div class="modal-footer">
          <button class="btn btn-dark" data-bs-dismiss="modal">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.8/js/bootstrap.min.js"></script>
  <script>
    document.querySelector("#ok3").addEventListener("click", function (event) {
      event.preventDefault();
    })
  </script>

  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="exampleModalLabel">Modal title</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          ...
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary">Save changes</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
